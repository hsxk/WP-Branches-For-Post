name: Release v2.0.1

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release-v2.0.1.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Trigger v2.0.1 release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: 4b390ba36a15f25d12c4d994017fd5af312a194a
          fetch-depth: 0

      - name: Create v2.0.1 tag
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v2.0.1 >/dev/null 2>&1; then
            echo "v2.0.1 already exists; refusing to retag."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v2.0.1 4b390ba36a15f25d12c4d994017fd5af312a194a -m "WP Branches For Post 2.0.1"
          git push origin refs/tags/v2.0.1

      - name: Deploy to WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          VERSION: 2.0.1
          SLUG: wp-branches-for-post
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.0.1
          name: WP Branches For Post 2.0.1
          generate_release_notes: true
          files: ${{ steps.deploy.outputs.zip-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
