name: Refresh 2.1 translation artifacts

on:
  push:
    branches:
      - release/2.1.0-validated

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh translations]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.1.0-validated
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install WP-CLI and gettext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
      - name: Rebuild canonical translation artifacts
        shell: bash
        run: |
          set -euo pipefail
          wp i18n make-pot "$GITHUB_WORKSPACE" languages/wp-branches-for-post.pot \
            --domain=wp-branches-for-post \
            --headers='{"Report-Msgid-Bugs-To":"https://wordpress.org/support/plugin/wp-branches-for-post"}' \
            --exclude=.git,node_modules,vendor,.github,.wordpress-org,tests,tools,dist,docs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("languages/wp-branches-for-post.pot")
          lines = []
          for line in path.read_text(encoding="utf-8").splitlines():
              if line.startswith('"POT-Creation-Date:'):
                  line = '"POT-Creation-Date: \\n"'
              lines.append(line)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          for locale in ja zh_CN zh_TW; do
            po="languages/wp-branches-for-post-${locale}.po"
            mo="languages/wp-branches-for-post-${locale}.mo"
            msgmerge --update --backup=none "$po" languages/wp-branches-for-post.pot
            msgattrib --no-obsolete "$po" -o "$po"
            python3 - "$po" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8").replace(
              '"Report-Msgid-Bugs-To: https://wordpress.org/support/plugin/wp-branch\\n"',
              '"Report-Msgid-Bugs-To: https://wordpress.org/support/plugin/wp-branches-for-post\\n"',
          )
          path.write_text(text, encoding="utf-8")
          PY
            msgfmt --check --check-format "$po" -o "$mo"
          done
          node tools/build-editor-translations.js
      - name: Commit refreshed artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages/
          if git diff --cached --quiet; then
            echo "Translation artifacts already canonical."
            exit 0
          fi
          git commit -m "i18n: rebuild 2.1 artifacts for canonical plugin slug [skip translation refresh]"
          git pull --rebase origin release/2.1.0-validated
          git push origin HEAD:release/2.1.0-validated
