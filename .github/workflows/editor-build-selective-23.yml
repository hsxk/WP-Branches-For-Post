name: Build selective Gutenberg editor (temporary)

on:
  push:
    branches:
      - feat/gutenberg-selective-conflict-resolution-23

permissions:
  contents: write

concurrency:
  group: wbfp-selective-build-23
  cancel-in-progress: false

jobs:
  update-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Format source and compile production editor
        run: |
          npm ci --no-audit --no-fund
          npm run lint:js -- --fix
          npm run lint:css -- --fix
          npm run lint:js
          npm run lint:css
          npm run build
      - name: Commit verified build assets on feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add src/index.js assets/css/editor.css build/
          if git diff --cached --quiet; then
            echo "Compiled editor matches the source."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build: synchronize selective Gutenberg conflict editor"
          git pull --rebase origin feat/gutenberg-selective-conflict-resolution-23
          git push origin HEAD:feat/gutenberg-selective-conflict-resolution-23
