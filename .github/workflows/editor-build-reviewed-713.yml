name: Prepare reviewed conflict editor and PHP formatting

on:
  push:
    branches:
      - feat/reviewed-resolutions-wp-713-20261012

permissions:
  contents: write

concurrency:
  group: wbfp-reviewed-713-editor
  cancel-in-progress: false

jobs:
  build-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Build and format source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint:js -- --fix
          npm run lint:css -- --fix
          npm run lint:js
          npm run lint:css
          npm run build
          composer install --no-interaction --no-progress
          vendor/bin/phpcbf includes/class-workflow-service.php includes/class-merge-service.php tests/wp-real-2.1.php || test "$?" = 1
          composer run lint
      - name: Commit generated production files
        shell: bash
        run: |
          set -euo pipefail
          git add src/index.js assets/css/editor.css build/index.js build/index.asset.php includes/class-workflow-service.php includes/class-merge-service.php tests/wp-real-2.1.php
          if git diff --cached --quiet; then
            echo 'Build already reproducible'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: format and compile reviewed conflict workflow'
          git pull --rebase origin feat/reviewed-resolutions-wp-713-20261012
          git push origin HEAD:feat/reviewed-resolutions-wp-713-20261012
