name: Generate WordPress.org assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate assets
        run: python tools/generate-wporg-assets.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .
          if git diff --cached --quiet; then
            echo "Assets are already up to date."
            exit 0
          fi
          git commit -m "assets: refresh WordPress.org artwork"
          git push origin "HEAD:${GITHUB_REF_NAME}"
