name: Refresh 2.1.1 translations

on:
  push:
    branches:
      - feat/2.1.1-review-branch-management

permissions:
  contents: write

jobs:
  refresh-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install WP-CLI and gettext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
      - name: Rebuild translations deterministically
        shell: bash
        run: |
          set -euo pipefail
          wp i18n make-pot "$GITHUB_WORKSPACE" languages/wp-branches-for-post.pot \
            --domain=wp-branches-for-post \
            --headers='{"Report-Msgid-Bugs-To":"https://wordpress.org/support/plugin/wp-branches-for-post"}' \
            --exclude=.git,node_modules,vendor,.github,.wordpress-org,tests,tools,dist,docs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("languages/wp-branches-for-post.pot")
          text = path.read_text(encoding="utf-8")
          lines = []
          for line in text.splitlines():
              if line.startswith('"POT-Creation-Date:'):
                  line = '"POT-Creation-Date: \\n"'
              lines.append(line)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          for locale in ja zh_CN zh_TW; do
            po="languages/wp-branches-for-post-${locale}.po"
            mo="languages/wp-branches-for-post-${locale}.mo"
            msgmerge --update --backup=none "$po" languages/wp-branches-for-post.pot
            msgattrib --no-obsolete "$po" -o "$po"
            python3 - "$po" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '"Report-Msgid-Bugs-To: https://wordpress.org/support/plugin/wp-branch\\n"',
              '"Report-Msgid-Bugs-To: https://wordpress.org/support/plugin/wp-branches-for-post\\n"',
          )
          path.write_text(text, encoding="utf-8")
          PY
            msgfmt --check --check-format "$po" -o "$mo"
          done
          node tools/build-editor-translations.js
      - name: Commit generated translations
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- languages; then
            echo "Translations are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages
          git commit -m "i18n: refresh 2.1.1 translation artifacts"
          git push origin HEAD:feat/2.1.1-review-branch-management
